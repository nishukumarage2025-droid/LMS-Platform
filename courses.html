<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Courses - LMS Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            color: #212529;
        }

        .course-card {
            height: 100%;
            overflow: hidden;
            border-radius: 5px;
        }

        .course-image {
            height: 180px;
            background-color: #cccccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888888;
            font-size: 20px;
        }

        footer {
            background-color: #4a6cf7;
            color: white;
        }

        footer a {
            color: white;
        }

        /* Dark Mode */
        body.dark-mode {
            background-color: #212529;
            color: white;
        }

        .dark-mode .course-card {
            background-color: #343a40;
            color: white;
        }

        .dark-mode .course-image {
            background-color: #495057;
            color: #ced4da;
        }

        .dark-mode .card-body {
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar bg-primary">
        <div class="container">

            <a class="navbar-brand text-white" href="index.html">
                LMS
            </a>

            <div class="nav">
                <a class="nav-link text-white-50" href="index.html">Home</a>

                <a class="nav-link text-white active" aria-current="page" href="courses.html">Courses</a>

                <a class="nav-link text-white-50" href="about.html">About</a>

                <a class="nav-link text-white-50" href="contact.html">Contact</a>

                <button id="darkModeBtn" class="btn btn-dark btn-sm ms-2">
                    Dark Mode
                </button>
            </div>

        </div>
    </nav>


    <!-- Courses Section -->
    <main class="container py-4">

        <h2 class="text-center mb-4">Our Courses</h2>

        <div class="row g-3">

            <!-- Course 1 -->
            <div class="col-md-4">

                <div class="card course-card">

                    <div class="course-image">
                        Programming
                    </div>

                    <div class="card-body p-2">

                        <h6 class="card-title mb-1">
                            Programming Basics
                        </h6>

                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#courseModal"
                            data-title="Programming Basics" data-description="Learn Python programming from scratch.">
                            View Details
                        </button>

                    </div>
                </div>

            </div>


            <!-- Course 2 -->
            <div class="col-md-4">

                <div class="card course-card">

                    <div class="course-image">
                        AI Fundamentals
                    </div>

                    <div class="card-body p-2">

                        <h6 class="card-title mb-1">
                            AI Fundamentals
                        </h6>

                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#courseModal"
                            data-title="AI Fundamentals"
                            data-description="Learn the fundamentals of Artificial Intelligence.">
                            View Details
                        </button>

                    </div>
                </div>

            </div>


            <!-- Course 3 -->
            <div class="col-md-4">

                <div class="card course-card">

                    <div class="course-image">
                        UI Design
                    </div>

                    <div class="card-body p-2">

                        <h6 class="card-title mb-1">
                            UI Design
                        </h6>

                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#courseModal"
                            data-title="UI Design"
                            data-description="Learn the basics of creating user-friendly interfaces.">
                            View Details
                        </button>

                    </div>
                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center py-3 mt-3">

        <p class="mb-0">
            &copy; 2024 LMS Platform. All Rights Reserved.
        </p>

    </footer>

    <!-- View Details Modal -->
    <div class="modal fade" id="courseModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="modalTitle">
                        Course Title
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <p id="modalDescription"></p>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Dark Mode JavaScript -->
    <script>

        const darkModeBtn = document.getElementById("darkModeBtn");

        darkModeBtn.addEventListener("click", function () {

            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {

                darkModeBtn.textContent = "Light Mode";

                darkModeBtn.classList.replace("btn-dark", "btn-light");

            } else {

                darkModeBtn.textContent = "Dark Mode";

                darkModeBtn.classList.replace("btn-light", "btn-dark");

            }

        });

    </script>

    <!-- View Details JavaScript -->
    <script>

        const courseModal = document.getElementById("courseModal");

        courseModal.addEventListener("show.bs.modal", function (event) {

            const button = event.relatedTarget;

            const title = button.getAttribute("data-title");

            const description = button.getAttribute("data-description");

            document.getElementById("modalTitle").textContent = title;

            document.getElementById("modalDescription").textContent = description;

        });

    </script>

</body>

</html>
