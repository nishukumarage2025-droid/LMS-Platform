<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - LMS Platform</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            color: #212529;
        }

        .navbar {
            background-color: #4a6cf7;
        }

        .contact-form {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        footer {
            background-color: #4a6cf7;
            color: white;
        }

        /* Dark Mode */
        body.dark-mode {
            background-color: #212529;
            color: white;
        }

        .dark-mode .contact-form {
            background-color: #343a40;
            color: white;
        }

        .dark-mode .form-label {
            color: white;
        }

        .dark-mode .form-control {
            background-color: #495057;
            color: white;
            border-color: #6c757d;
        }

        .dark-mode .form-control::placeholder {
            color: #ced4da;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                LMS
            </a>

            <div class="nav">

                <a class="nav-link text-white-50" href="index.html">
                    Home
                </a>

                <a class="nav-link text-white-50" href="courses.html">
                    Courses
                </a>

                <a class="nav-link text-white-50" href="about.html">
                    About
                </a>

                <a class="nav-link text-white active" aria-current="page" href="contact.html">
                    Contact
                </a>

                <button id="darkModeBtn" class="btn btn-dark btn-sm ms-2">
                    Dark Mode
                </button>

            </div>
        </div>
    </nav>


    <!-- Contact Section -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="contact-form">

                    <h2 class="text-center mb-4">Contact Us</h2>

                    <form id="contactForm">

                        <!-- Name -->
                        <div class="mb-3">

                            <label for="name" class="form-label">
                                Name
                            </label>

                            <input type="text" class="form-control" id="name" placeholder="Enter your name" required>

                        </div>

                        <!-- Email -->
                        <div class="mb-3">

                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>

                        </div>

                        <!-- Message -->
                        <div class="mb-3">

                            <label for="message" class="form-label">
                                Message
                            </label>

                            <textarea class="form-control" id="message" rows="4" placeholder="Enter your message"
                                required></textarea>

                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100">
                            Submit
                        </button>

                    </form>

                    <p id="successMessage" class="text-success text-center mt-3"></p>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center py-3">

        <p class="mb-0">
            &copy; 2024 LMS Platform. All Rights Reserved.
        </p>

    </footer>


    <!-- Dark Mode JavaScript -->
    <script>

        const darkModeBtn = document.getElementById("darkModeBtn");

        darkModeBtn.addEventListener("click", function () {

            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {

                darkModeBtn.textContent = "Light Mode";

                darkModeBtn.classList.replace("btn-dark", "btn-light");

            } else {

                darkModeBtn.textContent = "Dark Mode";

                darkModeBtn.classList.replace("btn-light", "btn-dark");

            }

        });

    </script>


    <!-- Contact Form JavaScript -->
    <script>

        const contactForm = document.getElementById("contactForm");

        contactForm.addEventListener("submit", function (event) {

            event.preventDefault();

            document.getElementById("successMessage").textContent =
                "Your message has been submitted successfully!";

            contactForm.reset();

        });

    </script>

</body>

</html>
